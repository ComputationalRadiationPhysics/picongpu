    "share/picongpu/benchmarks/TWEAC-FOM/cmakeFlags",
    "share/picongpu/examples/Bunch/cmakeFlags",
    "share/picongpu/examples/FoilLCT/cmakeFlags",
    "share/picongpu/examples/KelvinHelmholtz/cmakeFlags",
    "share/picongpu/examples/LaserWakefield/cmakeFlags",
    "share/picongpu/examples/AtomicPhysics/cmakeFlags",
    "share/picongpu/tests/CollisionsBeamRelaxation/cmakeFlags",
    "share/picongpu/tests/KHI_growthRate/cmakeFlags",
    "share/picongpu/examples/LaserWakefield/lib/python/snakemake/Snakefile_LSF",
]
SPDX-FileCopyrightText = "PIConGPU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- Extensionless files (CC-BY-4.0 for docs) ---

[[annotations]]
