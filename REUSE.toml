version = 1

# Catch2 (nested inside alpaka)
[[annotations]]
path = "thirdParty/alpaka/thirdParty/catch2/**"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "BSL-1.0"

# Alpaka source files (include/, test/ -- catches files missing SPDX headers)
[[annotations]]
path = "thirdParty/alpaka/include/**"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "thirdParty/alpaka/test/**"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "MPL-2.0"

# Alpaka docs, scripts, and misc
[[annotations]]
path = "thirdParty/alpaka/docs/**"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "thirdParty/alpaka/script/**"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "thirdParty/alpaka/example/**"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "thirdParty/alpaka/benchmarks/**"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "MPL-2.0"

# Alpaka root and config files
[[annotations]]
path = [
    "thirdParty/alpaka/.clang-format",
    "thirdParty/alpaka/.dockerignore",
    "thirdParty/alpaka/.gitignore",
    "thirdParty/alpaka/.github/**",
    "thirdParty/alpaka/.gitlab-ci.yml",
    "thirdParty/alpaka/.pre-commit-config.yaml",
    "thirdParty/alpaka/.readthedocs.yml",
    "thirdParty/alpaka/.zenodo.json",
    "thirdParty/alpaka/CHANGELOG.md",
    "thirdParty/alpaka/CONTRIBUTING.md",
    "thirdParty/alpaka/CMakePresets.json",
    "thirdParty/alpaka/README.md",
    "thirdParty/alpaka/README_SYCL.md",
    "thirdParty/alpaka/CITATION.cff",
    "thirdParty/alpaka/thirdParty/.clang-format",
]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "MPL-2.0"

# Nlohmann JSON cmake files
[[annotations]]
path = "thirdParty/nlohmann_json/cmake/**"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
    "thirdParty/nlohmann_json/CMakeLists.txt",
]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "MIT"

# CMake modules
[[annotations]]
path = "thirdParty/cmake-modules/**"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "ISC"

# CUDA memtest
[[annotations]]
path = "thirdParty/cuda_memtest/**"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "LicenseRef-IOSL"

# TOML11
[[annotations]]
path = "thirdParty/toml11/**"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "MIT"

# MallocMC
[[annotations]]
path = "thirdParty/mallocMC/**"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "MIT"

# ============================================================
# PIConGPU project files (replaces per-file .license sidecars)
# Default precedence is CLOSEST, so inline SPDX in a file
# always takes priority over these bulk annotations.
# ============================================================

# --- Source code types (GPL-3.0-or-later) ---

[[annotations]]
path = "**/*.def"
SPDX-FileCopyrightText = "PIConGPU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "**/*.kernel"
SPDX-FileCopyrightText = "PIConGPU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "**/*.unitless"
SPDX-FileCopyrightText = "PIConGPU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "**/*.param"
SPDX-FileCopyrightText = "PIConGPU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "**/*.tpp"
SPDX-FileCopyrightText = "PIConGPU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- Config files (GPL for share/picongpu/, CC-BY-4.0 for docs/) ---

[[annotations]]
path = "docs/**/*.cfg"
SPDX-FileCopyrightText = "PIConGPU contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "share/picongpu/**/*.cfg"
SPDX-FileCopyrightText = "PIConGPU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- HPC profile and job templates (GPL-3.0-or-later) ---

[[annotations]]
path = "**/*.example"
SPDX-FileCopyrightText = "PIConGPU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "**/*.tpl"
SPDX-FileCopyrightText = "PIConGPU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- Data, notebooks, CSV (GPL-3.0-or-later) ---

[[annotations]]
path = "**/*.data"
SPDX-FileCopyrightText = "PIConGPU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "**/*.ipynb"
SPDX-FileCopyrightText = "PIConGPU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "**/*.csv"
SPDX-FileCopyrightText = "PIConGPU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- PNG images (CC-BY-4.0 for docs/, GPL for root + share/) ---

[[annotations]]
path = "docs/**/*.png"
SPDX-FileCopyrightText = "PIConGPU contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["libraryDependencies.png", "docs/source/install/libraryDependencies.png", "share/**/*.png"]
SPDX-FileCopyrightText = "PIConGPU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- JSON files (CC-BY-4.0 for docs/, GPL for root) ---

[[annotations]]
path = "docs/**/*.json"
SPDX-FileCopyrightText = "PIConGPU contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ".zenodo.json"
SPDX-FileCopyrightText = "PIConGPU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- Documentation media (CC-BY-4.0) ---

[[annotations]]
path = [
    "docs/**/*.svg",
    "docs/**/*.pdf",
    "docs/**/*.odg",
    "docs/**/*.zip",
    "docs/**/*.tex",
    "docs/**/*.plantuml",
    "docs/**/*.dot",
    "docs/**/*.html",
]
SPDX-FileCopyrightText = "PIConGPU contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# --- Extensionless files (GPL - scripts and build configs) ---

[[annotations]]
path = [
    "src/tools/bin/addLicense",
    "src/tools/bin/deleteHeadComment",
    "src/tools/bin/findAndDo",
    "src/tools/bin/plotSumEnergyRange",
    "src/tools/bin/transpose",
