include:
  - local: "/share/ci/pypicongpu.yml"

stages:
  - validate
  - generate
  - test

variables:
  CONTAINER_TAG: "4.0"
  PIC_CI_MAINLINE: "TRUE"

.base_generate-reduced-matrix:
  stage: generate
  variables:
    PIP_BREAK_SYSTEM_PACKAGES: 1
  script:
    - apt update
    - apt install -y python3-pip
    - apt install -y curl
    - apt install -y git
    - pip3 install allpairspy
    - $CI_PROJECT_DIR/share/ci/git_merge.sh
    - $CI_PROJECT_DIR/share/ci/generate_reduced_matrix.sh -n ${TEST_TUPLE_NUM_ELEM} -j 15 > compile.yml
    - cat compile.yml
  artifacts:
    paths:
      - compile.yml
  tags:
    - x86_64
    - cpuonly
  interruptible: true

# pull request validation:
#   - check PR destination
#   - check python code style: flake8, pyflake
#   - rebase the PR to the destination branch
#   - check C++ code style
pull-request-validation:
  stage: validate
  image: ubuntu:noble
  variables:
    PIP_BREAK_SYSTEM_PACKAGES: 1
  script:
    - apt update
    - apt install -y -q git curl wget python3 python3-pip
    # Test if pull request can be merged into the destination branch
    - source $CI_PROJECT_DIR/share/ci/git_merge.sh
    - pip3 install -U -r requirements_pre-commit.txt
    - pre-commit install
    - pre-commit run --all-files --hook-stage manual --show-diff-on-failure
  tags:
    - x86_64
    - cpuonly
  interruptible: true

# generate reduced test matrix
# required variables (space separated lists):
#   PIC_INPUTS - Path to examples relative to share/picongpu.
#                If input is 'pmacc' the folder will be ignored and tests for pmacc will be generated.
#                e.g.
#                    "examples" starts one gitlab job per directory in `examples/*`
#                    "examples/" compile all directories in `examples/*` within one gitlab job
#                    "examples/KelvinHelmholtz" compile all cases within one gitlab job
picongpu-generate-reduced-matrix_examples:
  variables:
    PIC_INPUTS: "examples"
    TEST_TUPLE_NUM_ELEM: 1
    QUICK_CI_TESTS: 1
  extends: ".base_generate-reduced-matrix"

picongpu-compile-reduced-matrix_examples:
  stage: test
  trigger:
    include:
      - artifact: compile.yml
        job: picongpu-generate-reduced-matrix_examples
    strategy: depend

picongpu-generate-reduced-matrix_tests:
  variables:
    PIC_INPUTS: "tests"
    TEST_TUPLE_NUM_ELEM: 1
    QUICK_CI_TESTS: 1
  extends: ".base_generate-reduced-matrix"

picongpu-compile-reduced-matrix_tests:
  stage: test
  trigger:
    include:
      - artifact: compile.yml
        job: picongpu-generate-reduced-matrix_tests
    strategy: depend

picongpu-generate-reduced-matrix_benchmarks:
  variables:
    PIC_INPUTS: "benchmarks"
    TEST_TUPLE_NUM_ELEM: 1
    QUICK_CI_TESTS: 1
  extends: ".base_generate-reduced-matrix"

picongpu-compile-reduced-matrix_benchmarks:
  stage: test
  trigger:
    include:
      - artifact: compile.yml
        job: picongpu-generate-reduced-matrix_benchmarks
    strategy: depend

pmacc-generate-reduced-matrix:
  variables:
    PIC_INPUTS: "pmacc"
    TEST_TUPLE_NUM_ELEM: 1
  extends: ".base_generate-reduced-matrix"

pmacc-compile-reduced-matrix:
  stage: test
  trigger:
    include:
      - artifact: compile.yml
        job: pmacc-generate-reduced-matrix
    strategy: depend

pmacc-header-generate-reduced-matrix:
  variables:
    PIC_INPUTS: "pmacc_header"
    TEST_TUPLE_NUM_ELEM: 1
  extends: ".base_generate-reduced-matrix"

pmacc-header-compile-reduced-matrix:
  stage: test
  trigger:
    include:
      - artifact: compile.yml
        job: pmacc-header-generate-reduced-matrix
    strategy: depend

picongpu-unittest-generate-reduced-matrix:
  variables:
    PIC_INPUTS: "unit"
    TEST_TUPLE_NUM_ELEM: 1
  extends: ".base_generate-reduced-matrix"

picongpu-unittest-compile-reduced-matrix:
  stage: test
  trigger:
    include:
      - artifact: compile.yml
        job: picongpu-unittest-generate-reduced-matrix
    strategy: depend

picongpu-header-generate-reduced-matrix:
  variables:
    PIC_INPUTS: "picongpu_header"
    TEST_TUPLE_NUM_ELEM: 1
  extends: ".base_generate-reduced-matrix"

picongpu-header-compile-reduced-matrix:
  stage: test
  trigger:
    include:
      - artifact: compile.yml
        job: picongpu-header-generate-reduced-matrix
    strategy: depend

pypicongpu-generate-full-matrix:
  stage: generate
  image: ubuntu:24.04
  variables:
    PIP_BREAK_SYSTEM_PACKAGES: 1
  script:
    - apt update
    - apt install -y python3 python3-pip
    - pip3 install -r $CI_PROJECT_DIR/share/ci/pypicongpu_generator_requirements.txt
    - $CI_PROJECT_DIR/share/ci/git_merge.sh
    - python3 $CI_PROJECT_DIR/share/ci/pypicongpu_generator.py $CI_PROJECT_DIR/lib/python/pyproject.toml > compile.yml
    - cat compile.yml
  artifacts:
    paths:
      - compile.yml
  tags:
    - x86_64
  interruptible: true

pypicongpu-full-matrix:
  stage: test
  trigger:
    include:
      - artifact: compile.yml
        job: pypicongpu-generate-full-matrix
    strategy: depend

pypicongpu-compiling-test:
  stage: test
  extends: .base_pypicongpu_compile_test
  variables:
    PIP_BREAK_SYSTEM_PACKAGES: 1
    CI_CONTAINER_NAME: 'ubuntu24.04'
    PYTHON_VERSION: '3.11.*'
    CXX_VERSION: 'g++-13'
    CMAKE_VERSION: '3.28'
    BOOST_VERSION: '1.75.0'
    PYTHON_COMPILING_TEST: 'ON'

pypicongpu-end-to-end-test:
  stage: test
  extends: .base_pypicongpu_compile_test
  variables:
    PIP_BREAK_SYSTEM_PACKAGES: 1
    CI_CONTAINER_NAME: 'ubuntu24.04'
    PYTHON_VERSION: '3.11.*'
    CXX_VERSION: 'g++-13'
    CMAKE_VERSION: '3.28'
    BOOST_VERSION: '1.75.0'
    PYTHON_END_TO_END_TEST: 'ON'
    # ISAAC does not support CPU and its plugin dominates the build memory
    # (a single translation unit peaks at ~13 GiB); the e2e tests do not use it.
    DISABLE_ISAAC: '1'

# tests the documentation snippets (docs/source/python_package/snippets):
#   - executes every python snippet (simulation runs are emulated, no compilation)
#   - syntax-checks every bash snippet
#   - sources the profile of a generated input set, as the "legacy workflow" snippet does
#   - builds the documentation and fails if a snippet cannot be included
docs-snippets:
  stage: test
  image: registry.hzdr.de/crp/alpaka-group-container/alpaka-ci-${CI_CONTAINER_NAME}-gcc-pic:${CONTAINER_TAG}
  variables:
    GIT_SUBMODULE_STRATEGY: normal
    CI_CONTAINER_NAME: 'ubuntu24.04'
    PYTHON_VERSION: '3.11.*'
    # reuse the pypicongpu environment without writing /.picongpurc.toml
    # (the snippet tests need a pristine rc_params state) and without running
    # the quick tests (covered by the pypicongpu jobs)
    PYPICONGPU_SKIP_QUICK_TEST: '1'
  script:
    - echo "CI_CONTAINER_NAME -> $CI_CONTAINER_NAME"
    - echo "PYTHON_VERSION -> $PYTHON_VERSION"
    - source $CI_PROJECT_DIR/share/ci/install/pypicongpu.sh
    - pip3 install -r $CI_PROJECT_DIR/docs/requirements.txt
    - apt update
    - apt install -y doxygen
    # the build and submission tools referenced by the "running a simulation" snippets
    - pic-build --help
    - pic-configure --help
    - tbg --help
    # run the snippet test suite
    - cd $CI_PROJECT_DIR
    - python3 -m pytest docs/source/python_package/snippets -q -p no:cacheprovider
    # generate a minimal input set with the bash preset and source its profile
    # (no compilation), as the "legacy workflow" snippet does
    - $CI_PROJECT_DIR/share/ci/docs_snippets_profile_check.sh
    # build the documentation
    - cd $CI_PROJECT_DIR/docs
    - doxygen
    - sphinx-build -b html source build/html 2>&1 | tee $CI_PROJECT_DIR/docs-snippets-sphinx.log
    # a missing snippet file only produces a sphinx warning, so fail explicitly
    - |
      if grep -E "Include file .+ not found or reading it failed" $CI_PROJECT_DIR/docs-snippets-sphinx.log; then
          echo "ERROR: at least one documentation snippet is missing or unreadable"
          exit 1
      fi
      grep "build succeeded" $CI_PROJECT_DIR/docs-snippets-sphinx.log
  tags:
    - cpuonly
    - x86_64
   interruptible: true
