[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools>=61", "wheel" ]

[project]
name = "picongpu"
# should be always identical with PIConGPU version
version = "0.9.0.dev"
description = "Python package for PIConGPU"
license = "GPL-3.0-or-later"
# Our hand-rolled type-safety infrastructure is getting in the way of 3.14.
# Planning to fix (and remove this again) in the near future:
requires-python = ">=3.11,<3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# dependecies list generated with
# https://gist.github.com/pordyna/ff27ce949a8e944fe30252f47b5b831f
dependencies = [
  "chevron>=0.13.1",
  "h5py",
  "imageio",
  "jsonschema>=4.23",
  "matplotlib",
  "mpmath>=1.3",
  "numpy>=1.26.2",
  "openpmd-api>=0.16.1",
  "pandas>=2.2.3",
  "particle>=0.25.1",
  "periodictable>=1.7.1",
  "picmistandard>=0.27",
  "pillow",
  "pint",
  "pydantic>=2.6.4",
  "referencing>=0.35.1",
  "scipy>=1.12",
  "sympy>=1.14",
  "tomli-w>=1.2",
  "typeguard>=4.2.1",
]

[project.optional-dependencies]
test = ["pytest>=9"]

[tool.setuptools.packages.find]
where = [ "." ]
include = [ "picongpu*" ]

[tool.pytest.ini_options]
pythonpath = [ "." ]
python_files = [ "*.py" ]
python_classes = [ "Test*" ]
python_functions = [ "test_*" ]
addopts = "--ignore=test/testsuite --ignore=test/setups --ignore=picongpu"
