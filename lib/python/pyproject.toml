[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "picongpu"
version = "0.9.0.dev"
description = "Python package for PIConGPU"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# dependecies list generated with
# https://gist.github.com/pordyna/ff27ce949a8e944fe30252f47b5b831f
dependencies = [
  "cwltool",
  "h5py",
  "imageio",
  "jsonschema>=4.23",
  "matplotlib",
  # interim: released engine; our rendering contexts normalise a present None to
  # "" (the upstream fix-none-handling build renders it as "None" and keeps
  # partially-missing dotted names as None). Template use is section-only today,
  # where None and "" are both falsy:
  "moosetash==1.0.1",
  "mpmath>=1.3",
  "numpy>=1.26.2",
  "openpmd-api>=0.17.0",
  "pandas>=2.2.3",
  "particle>=0.25.1",
  "periodictable>=1.7.1",
  "picmistandard>=0.35.0",
  "pint",
  "pydantic>=2.13",
  "pyyaml",
  "questionary>=2",
  "referencing>=0.35.1",
  # RO-Crate 1.2 support is in published releases since 0.15.0 (0.16.0 also adds RO-Crate 1.3),
  # so the former floating "@master" pin is no longer needed.
  "rocrate>=0.16.0",
  "scipy>=1.12",
  "sympy>=1.14",
  "tomli-w>=1.2",
]

optional-dependencies.test = [ "pytest>=9", "roc-validator" ]

scripts.pic-deps = "picongpu.pic_deps:main"

scripts.picrc-builder = "picongpu.picrc_builder:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [ "picongpu" ]

[tool.hatch.build.targets.sdist]
packages = [ "picongpu" ]

# The PIConGPU core trees (include/, etc/, bin/, ...) live outside lib/python in
# a source checkout but must end up inside the package (picongpu/core/...) in
# both the sdist and the wheel. A checkout-relative force-include path
# (../../include, ...) fails when building from an extracted sdist, because
# those paths do not exist there. hatch_build.py therefore adds the mappings
# only when the source trees are present; when building from an sdist the trees
# are already under picongpu/core/ and are picked up by `packages`.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "compiling: tests that compile PIConGPU simulations",
  "end_to_end: end-to-end simulation tests",
]
filterwarnings = [ "error" ]
