version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
  - graphviz

sphinx:
 configuration: docs/source/conf.py

python:
 install:
 - requirements: docs/requirements.txt
 # the API reference page (python_package/api) autodocs the public
 # picongpu.picmi package, which must be importable in the build env
 - {path: lib/python, method: pip}

formats:
  - htmlzip
  - pdf
  - epub
