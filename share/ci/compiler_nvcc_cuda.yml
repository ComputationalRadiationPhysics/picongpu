################################################################################
#   [g++-X]     : X = {11, 12, 13, 14, 15}
#   [clang++-X] : X = {16, ..., 21}
# nvcc restricted to the host compiler versions supported by the CUDA toolkit
# clang++ as nvcc host compiler is temporarily disabled, see
# share/ci/n_wise_generator.py - nvcc rejects kernel arguments with `const`
# class-type members as not trivially copyable when clang++ is the host
# compiler. The device compiler is always nvcc here.

.base_nvcc:
  image: registry.hzdr.de/crp/alpaka-group-container/alpaka-ci-${CI_CONTAINER_NAME}-cuda${CUDA_CONTAINER_VERSION}-gcc-pic:${CONTAINER_TAG}
  variables:
    GIT_SUBMODULE_STRATEGY: normal
    # workaround github clone issues: https://github.com/orgs/community/discussions/206581
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: "http.https://github.com.version"
    GIT_CONFIG_VALUE_0: "HTTP/1.1"
  before_script:
    - nvidia-smi
    - nvcc --version
  script:
    - apt update
    - apt install -y curl libjpeg-dev
    - source $CI_PROJECT_DIR/share/ci/install/cmake.sh
    - source $CI_PROJECT_DIR/share/ci/install/host_compiler.sh
    - $CI_PROJECT_DIR/share/ci/git_merge.sh
    - source $CI_PROJECT_DIR/share/ci/bash.profile
    - source $CI_PROJECT_DIR/share/ci/install/openPMD.sh
    - source $CI_PROJECT_DIR/share/ci/install/fftw.sh
    - $CI_PROJECT_DIR/share/ci/run_tests.sh $PIC_TEST_CASE_FOLDER
  interruptible: true

.base_nvcc_cuda_compile:
  extends: .base_nvcc
  tags:
    - cpuonly
    - x86_64

.base_nvcc_cuda_run:
  extends: .base_nvcc
  tags:
    - cuda
    - x86_64
